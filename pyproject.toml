[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hycan"
version = "1.0.0.dev0"
description = "HyCAN-DB: Hydrogen in Carbon Nanomaterials Database — data curation, meta-analysis, and ML benchmarking pipeline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Avin Gupta", email = "iamavingupta@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "polars",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "xgboost",
    "shap",
    "pydantic",
    "pandera",
    "openpyxl",
    "pyyaml",
    "duckdb",
    "statsmodels",
    "CoolProp",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "jupyterlab", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
